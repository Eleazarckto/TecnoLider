# ════════════════════════════════════════════════════════════════════
# gradle.properties — TECNO LÍDER
# ════════════════════════════════════════════════════════════════════
# AJUSTADO PARA UN EQUIPO DE 8 GB (7,2 GB utilizables).
#
# Los valores anteriores (-Xmx4G + MaxMetaspaceSize=2G) pedían 6 GB solo
# para el daemon de Gradle. Sumado al daemon de Kotlin, a Windows y al
# editor, la JVM no conseguía la memoria y el build moría con
# "Gradle build daemon disappeared unexpectedly" + un hs_err_pid.log
# (Out of Memory Error en os_windows.cpp).
#
# Si algún día compilás en una máquina de 16 GB o más, podés volver a
# subir Xmx a 4G y reactivar org.gradle.parallel para ganar velocidad.
# ════════════════════════════════════════════════════════════════════

# JVM heap del daemon de Gradle.
# 1,5 GB es lo máximo que tolera este equipo con el editor abierto. Con
# 2 GB seguía muriendo: la JVM necesita memoria NATIVA además del heap
# (metaspace, code cache, stacks de hilos, buffers), así que el consumo
# real siempre supera al Xmx.
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=384m -XX:ReservedCodeCacheSize=192m -Dfile.encoding=UTF-8

# Heap del daemon de Kotlin. Es un proceso APARTE del de Gradle: si no
# se le pone techo, arranca con su propio default y compite por la
# misma memoria.
kotlin.daemon.jvmargs=-Xmx768m -XX:MaxMetaspaceSize=256m

# Builds paralelos — DESACTIVADO a propósito.
# El equipo tiene 12 núcleos, así que Gradle levantaba hasta 12 workers
# a la vez. Con 8 GB de RAM eso es contraproducente: no hay memoria para
# alimentarlos y el build termina más lento (o se cae).
org.gradle.parallel=false

# Tope de workers para las tareas que sí paralelizan internamente.
org.gradle.workers.max=4

# Caché de configuración (acelera builds incrementales)
org.gradle.caching=true

# AndroidX (obligatorio en Flutter actual)
android.useAndroidX=true
android.enableJetifier=true

# R8 full mode: solo se aplica si activas minifyEnabled (por ahora false)
android.enableR8.fullMode=true

# Kotlin: compilador incremental
kotlin.incremental=true
kotlin.code.style=official
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
