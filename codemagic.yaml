# ════════════════════════════════════════════════════════════════════
#  codemagic.yaml — Tecno Líder · Multi-plataforma
# ════════════════════════════════════════════════════════════════════
#
#  Cinco workflows:
#
#   0) ios-testflight  → iOS firmado, sube a App Store Connect · manual
#   1) ios-unsigned    → solo iOS (.ipa)         · disparo manual
#   2) apple-all       → APK + IPA + DMG en Mac  · disparo manual
#   3) windows-build   → solo Windows (.exe)     · disparo manual
#   4) all-platforms   → workflow informativo (cómo lanzar todo)
#
#  CÓMO COMPILAR LOS 4 ARCHIVOS DE UNA VEZ:
#    En el panel web de Codemagic → "Start new build"
#    Selecciona AMBOS workflows: apple-all  y  windows-build
#    Ambos arrancan EN PARALELO en máquinas distintas.
#    En ~30 min recibes correo con los 4 archivos descargables.
# ════════════════════════════════════════════════════════════════════

workflows:

  # ══════════════════════════════════════════════════════════════════
  #  iOS FIRMADO → APP STORE CONNECT (TestFlight)
  # ══════════════════════════════════════════════════════════════════
  #
  #  ESTE ES EL FLUJO PARA SUBIR UNA VERSION NUEVA A LA APP STORE.
  #  Los otros flujos de iOS compilan SIN FIRMA: sirven para comprobar
  #  que compila, pero App Store Connect no acepta ese IPA.
  #
  #  Copiado del flujo `ios-testflight` de BrizuelaApp, sin la parte de
  #  avisos push (TecnoLider no usa Firebase ni entitlements).
  #
  #  DE DONDE SALEN LAS CREDENCIALES
  #  --------------------------------
  #  Del grupo de variables `firma_ios`, el mismo nombre que usan
  #  Brizuela y Transporte GG:
  #
  #    APP_STORE_CONNECT_PRIVATE_KEY     (el .p8 de App Store Connect)
  #    APP_STORE_CONNECT_KEY_IDENTIFIER  (su Key ID)
  #    APP_STORE_CONNECT_ISSUER_ID       (el Issuer ID de la cuenta)
  #    CERTIFICATE_PRIVATE_KEY           (la clave del certificado de firma)
  #
  #  En Codemagic los grupos son POR APLICACION: si la app TecnoLider no
  #  tiene ese grupo, se crea en TecnoLider > Settings > Environment
  #  variables con esas cuatro variables (marcadas Secure) y los MISMOS
  #  valores. La clave de App Store Connect autentica contra la CUENTA,
  #  no contra una app: cada compilacion sube a la app de su bundle id.
  #  Si el primer paso de firma dice que faltan variables, es esto.
  #
  #  La app en App Store Connect es la del bundle
  #  com.tecnolider.tecnoLider (equipo Y3D33YTV52).
  ios-testflight:
    name: iOS · App Store Connect (firmado, TestFlight)
    instance_type: mac_mini_m2
    max_build_duration: 90

    environment:
      # Version fijada a proposito, la misma con la que se compila en
      # Windows. Con `stable` Codemagic puede tomar otra version y que
      # CocoaPods no resuelva el pod "Flutter".
      flutter: 3.47.2
      xcode: latest
      cocoapods: default
      groups:
        - firma_ios
      vars:
        BUNDLE_ID: com.tecnolider.tecnoLider

    triggering:
      cancel_previous_builds: true

    scripts:
      - name: Comprobaciones previas
        script: |
          set -e
          PBXPROJ="ios/Runner.xcodeproj/project.pbxproj"
          if grep -q "PRODUCT_BUNDLE_IDENTIFIER = com.example" "$PBXPROJ"; then
            echo "ERROR: el bundle id sigue siendo com.example.*"
            exit 1
          fi
          if ! grep -q "PRODUCT_BUNDLE_IDENTIFIER = $BUNDLE_ID;" "$PBXPROJ"; then
            echo "ERROR: el proyecto no usa el bundle id $BUNDLE_ID"
            grep "PRODUCT_BUNDLE_IDENTIFIER" "$PBXPROJ" | sort -u
            exit 1
          fi
          echo "Bundle id: $BUNDLE_ID"
          grep "^version:" pubspec.yaml

      - name: Dependencias de Flutter
        script: flutter pub get

      - name: Certificado y perfil de Apple (se crean si faltan)
        # `CERTIFICATE_PRIVATE_KEY` no se puede omitir: el CLI no genera
        # la clave por su cuenta. Se genera UNA vez y se guarda como
        # variable; si se generara en cada compilacion, cada una crearia
        # un certificado nuevo y a la tercera Apple no deja crear mas.
        script: |
          set -e
          keychain initialize

          faltan=""
          for v in APP_STORE_CONNECT_ISSUER_ID APP_STORE_CONNECT_KEY_IDENTIFIER \
                   APP_STORE_CONNECT_PRIVATE_KEY CERTIFICATE_PRIVATE_KEY; do
            if [ -z "${!v}" ]; then faltan="$faltan $v"; fi
          done
          if [ -n "$faltan" ]; then
            echo "=========================================================="
            echo "ERROR: faltan variables de firma en ESTA aplicacion:"
            echo "  $faltan"
            echo
            echo "En Codemagic los grupos de variables son POR APLICACION."
            echo "En Codemagic > TecnoLider > Settings > Environment"
            echo "variables, grupo 'firma_ios', marcadas como Secure, con"
            echo "los MISMOS valores que tiene el grupo de Brizuela:"
            echo
            echo "  APP_STORE_CONNECT_ISSUER_ID      el Issuer ID"
            echo "  APP_STORE_CONNECT_KEY_IDENTIFIER el Key ID"
            echo "  APP_STORE_CONNECT_PRIVATE_KEY    el contenido del .p8"
            echo "  CERTIFICATE_PRIVATE_KEY          la clave RSA en PEM"
            echo "=========================================================="
            exit 1
          fi

          # Con la clave, el CLI reutiliza el certificado de distribucion
          # si ya existe y lo crea si no. Como la clave es siempre la
          # misma, no se acumulan certificados.
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-key=@env:CERTIFICATE_PRIVATE_KEY \
            --create

          keychain add-certificates
          xcode-project use-profiles

      - name: Numero de compilacion
        # App Store Connect rechaza un numero de compilacion que ya subio.
        # La app ya tiene compilaciones subidas (a mano o desde otro
        # flujo), asi que el contador de Codemagic, que empieza en 1 en
        # un flujo nuevo, podria quedar por debajo. Se toma el mayor de:
        # la ultima compilacion en TestFlight + 1, la ultima en la App
        # Store + 1, el numero del pubspec y el contador de Codemagic.
        script: |
          set -e
          PUBSPEC_BUILD=$(grep "^version:" pubspec.yaml | sed 's/.*+//' | tr -d '[:space:]')
          APP_ID=$(app-store-connect apps list \
                     --bundle-id-identifier "$BUNDLE_ID" \
                     --strict-match-identifier --json 2>/dev/null \
                   | python3 -c "import sys,json; d=json.load(sys.stdin); print(d[0]['id'] if d else '')" \
                   2>/dev/null || true)
          echo "Apple ID de la app: ${APP_ID:-no encontrado}"
          TF=0; AS=0
          if [ -n "$APP_ID" ]; then
            TF=$(app-store-connect get-latest-testflight-build-number "$APP_ID" 2>/dev/null || echo 0)
            AS=$(app-store-connect get-latest-app-store-build-number "$APP_ID" 2>/dev/null || echo 0)
          fi
          # Solo digitos: si el CLI devolvio otra cosa, cuenta como 0.
          case "$TF" in ''|*[!0-9]*) TF=0 ;; esac
          case "$AS" in ''|*[!0-9]*) AS=0 ;; esac
          case "$PUBSPEC_BUILD" in ''|*[!0-9]*) PUBSPEC_BUILD=0 ;; esac
          N=$BUILD_NUMBER
          for c in $((TF + 1)) $((AS + 1)) $PUBSPEC_BUILD; do
            [ "$c" -gt "$N" ] && N=$c
          done
          echo "TestFlight: $TF · App Store: $AS · pubspec: $PUBSPEC_BUILD · Codemagic: $BUILD_NUMBER"
          echo "Numero de compilacion a usar: $N"
          echo "NUMERO_COMPILACION=$N" >> "$CM_ENV"

      - name: Compilar el IPA firmado
        # La version visible (1.0.x) sale del pubspec.yaml.
        script: |
          set -e
          flutter build ipa --release \
            --build-number=$NUMERO_COMPILACION \
            --export-options-plist=/Users/builder/export_options.plist
          ls -lh build/ios/ipa/

    artifacts:
      - build/ios/ipa/*.ipa

    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
      email:
        recipients:
          - eleazarceccato@gmail.com
        notify:
          success: true
          failure: true

  # ──────────────────────────────────────────────────────────
  # WORKFLOW 1: SOLO iOS (el original que ya tenías funcionando)
  # ──────────────────────────────────────────────────────────
  ios-unsigned:
    name: iOS IPA sin firmar - Tecno Líder
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default

    scripts:
      - name: Diagnóstico del entorno
        script: |
          set +e
          echo "═══════════ DIAGNÓSTICO ═══════════"
          echo ""
          echo "── ¿Dónde estoy? ──"
          pwd
          echo ""
          echo "── ¿Qué hay en esta carpeta? ──"
          ls -la
          echo ""
          echo "── ¿pubspec.yaml está aquí? ──"
          if [ -f pubspec.yaml ]; then
            echo ">>> SÍ: pubspec.yaml encontrado en la raíz"
          else
            echo ">>> NO: pubspec.yaml NO está aquí"
            echo ">>> Buscándolo en subcarpetas..."
            find . -maxdepth 2 -name pubspec.yaml -print
          fi
          echo ""
          echo "── ¿Dónde está el binario de Flutter? ──"
          which flutter
          echo "FLUTTER_ROOT = $FLUTTER_ROOT"
          echo ""
          echo "── PATH ──"
          echo "$PATH"
          echo ""
          echo "── Intentando flutter --version ──"
          flutter --version
          echo ""
          echo "── Intentando flutter doctor ──"
          flutter doctor -v
          echo ""
          echo "═══════════ FIN DIAGNÓSTICO ═══════════"
          exit 0

      - name: Preparar Flutter
        script: |
          export PATH="$HOME/programs/flutter/bin:$PATH"
          flutter --version
          flutter config --no-analytics

      - name: Generar carpetas de plataforma iOS
        script: |
          export PATH="$HOME/programs/flutter/bin:$PATH"
          flutter create . --platforms=ios --org com.tecnolider
          ls -la ios/

      - name: Desactivar Swift Package Manager
        script: |
          export PATH="$HOME/programs/flutter/bin:$PATH"
          flutter config --no-enable-swift-package-manager
          flutter config | grep -i swift || true

      - name: Instalar dependencias de Flutter
        script: |
          export PATH="$HOME/programs/flutter/bin:$PATH"
          flutter pub get

      - name: Instalar CocoaPods
        script: |
          cd ios
          pod install --repo-update
          cd ..

      - name: Compilar iOS sin firmar
        script: |
          export PATH="$HOME/programs/flutter/bin:$PATH"
          flutter build ios --release --no-codesign

      - name: Empaquetar como IPA
        script: |
          cd build/ios/iphoneos
          mkdir -p Payload
          cp -r Runner.app Payload/
          zip -r tecno_lider_unsigned.ipa Payload
          mv tecno_lider_unsigned.ipa $CM_BUILD_DIR/

      - name: Mostrar tamaño del IPA generado
        script: |
          ls -lh $CM_BUILD_DIR/tecno_lider_unsigned.ipa

    artifacts:
      - $CM_BUILD_DIR/tecno_lider_unsigned.ipa

    publishing:
      email:
        recipients:
          - eleazarceccato@gmail.com
        notify:
          success: true
          failure: true

  # ──────────────────────────────────────────────────────────
  # WORKFLOW 2: APPLE COMPLETO (APK + IPA + DMG en una sola Mac)
  # ──────────────────────────────────────────────────────────
  # Una Mac puede compilar Android (APK), iOS (IPA) y macOS (DMG).
  # Es eficiente: una sola máquina, una sola corrida.
  # ──────────────────────────────────────────────────────────
  apple-all:
    name: Apple completo - APK + IPA + DMG
    max_build_duration: 90
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default

    scripts:
      - name: Diagnóstico del entorno
        script: |
          set +e
          echo "═══════════ DIAGNÓSTICO ═══════════"
          pwd
          ls -la
          which flutter
          flutter --version
          echo "═══════════ FIN DIAGNÓSTICO ═══════════"
          exit 0

      - name: Preparar Flutter
        script: |
          export PATH="$HOME/programs/flutter/bin:$PATH"
          flutter --version
          flutter config --no-analytics

      - name: Generar carpetas de plataforma (Android, iOS, macOS)
        script: |
          export PATH="$HOME/programs/flutter/bin:$PATH"
          flutter create . --platforms=android,ios,macos --org com.tecnolider
          ls -la

      - name: Desactivar Swift Package Manager
        script: |
          export PATH="$HOME/programs/flutter/bin:$PATH"
          flutter config --no-enable-swift-package-manager

      - name: Instalar dependencias
        script: |
          export PATH="$HOME/programs/flutter/bin:$PATH"
          flutter pub get

      - name: Generar iconos
        script: |
          export PATH="$HOME/programs/flutter/bin:$PATH"
          dart run flutter_launcher_icons || echo "Iconos: continuando"

      - name: Generar splash
        script: |
          export PATH="$HOME/programs/flutter/bin:$PATH"
          dart run flutter_native_splash:create || echo "Splash: continuando"

      # ─── ANDROID ────────────────────────────────────────
      - name: Compilar APK Android
        script: |
          export PATH="$HOME/programs/flutter/bin:$PATH"
          flutter build apk --release --no-tree-shake-icons
          cp build/app/outputs/flutter-apk/app-release.apk \
             $CM_BUILD_DIR/tecno_lider.apk
          ls -lh $CM_BUILD_DIR/tecno_lider.apk

      # ─── iOS ────────────────────────────────────────────
      - name: Instalar CocoaPods (iOS)
        script: |
          cd ios
          pod install --repo-update
          cd ..

      - name: Compilar iOS sin firmar
        script: |
          export PATH="$HOME/programs/flutter/bin:$PATH"
          flutter build ios --release --no-codesign --no-tree-shake-icons

      - name: Empaquetar como IPA
        script: |
          cd build/ios/iphoneos
          mkdir -p Payload
          cp -r Runner.app Payload/
          zip -r tecno_lider.ipa Payload
          mv tecno_lider.ipa $CM_BUILD_DIR/
          ls -lh $CM_BUILD_DIR/tecno_lider.ipa

      # ─── macOS ──────────────────────────────────────────
      - name: Compilar macOS
        script: |
          export PATH="$HOME/programs/flutter/bin:$PATH"
          flutter build macos --release --no-tree-shake-icons

      - name: Empaquetar DMG y ZIP de macOS
        script: |
          cd build/macos/Build/Products/Release
          # ZIP del .app (más compatible que DMG)
          zip -r tecno_lider-mac.zip tecno_lider.app
          mv tecno_lider-mac.zip $CM_BUILD_DIR/
          # DMG nativo de macOS
          hdiutil create -volname "TecnoLider" \
              -srcfolder tecno_lider.app \
              -ov -format UDZO \
              tecno_lider.dmg && \
              mv tecno_lider.dmg $CM_BUILD_DIR/ || \
              echo "DMG falló — el ZIP es el artifact principal"
          ls -lh $CM_BUILD_DIR/

    artifacts:
      - $CM_BUILD_DIR/tecno_lider.apk
      - $CM_BUILD_DIR/tecno_lider.ipa
      - $CM_BUILD_DIR/tecno_lider.dmg
      - $CM_BUILD_DIR/tecno_lider-mac.zip

    publishing:
      email:
        recipients:
          - eleazarceccato@gmail.com
        notify:
          success: true
          failure: true

  # ──────────────────────────────────────────────────────────
  # WORKFLOW 3: WINDOWS (.exe en una máquina Windows)
  # ──────────────────────────────────────────────────────────
  # Windows SOLO se puede compilar en una máquina Windows; por eso
  # este workflow es separado del de Apple. Pero corre en paralelo
  # cuando lanzas ambos a la vez.
  # ──────────────────────────────────────────────────────────
  windows-build:
    name: Windows EXE - Tecno Líder
    max_build_duration: 60
    instance_type: windows_x2
    environment:
      flutter: stable

    scripts:
      - name: Diagnóstico Windows
        script: |
          flutter --version
          flutter doctor -v

      - name: Habilitar Windows desktop
        script: |
          flutter config --enable-windows-desktop

      - name: Generar carpeta windows
        script: |
          flutter create . --platforms=windows --org com.tecnolider

      - name: Instalar dependencias
        script: |
          flutter pub get

      - name: Generar iconos Windows (.ico)
        script: |
          dart run flutter_launcher_icons

      - name: Compilar EXE
        script: |
          flutter build windows --release

      - name: Empaquetar ZIP para distribuir al cliente
        script: |
          # La carpeta Release/ contiene exe + DLLs + data/ que son
          # necesarios. La empaquetamos completa para distribución.
          Compress-Archive -Path "build/windows/x64/runner/Release/*" `
                          -DestinationPath "$env:CM_BUILD_DIR/TecnoLider-Windows.zip" `
                          -Force
          Copy-Item "build/windows/x64/runner/Release/tecno_lider.exe" `
                    "$env:CM_BUILD_DIR/tecno_lider.exe"
          Get-Item "$env:CM_BUILD_DIR/TecnoLider-Windows.zip" | Format-List

    artifacts:
      - $CM_BUILD_DIR/TecnoLider-Windows.zip
      - $CM_BUILD_DIR/tecno_lider.exe

    publishing:
      email:
        recipients:
          - eleazarceccato@gmail.com
        notify:
          success: true
          failure: true

  # ──────────────────────────────────────────────────────────
  # WORKFLOW 4: Recordatorio (no compila nada útil, solo info)
  # ──────────────────────────────────────────────────────────
  all-platforms:
    name: "Instrucciones - compilar TODAS las plataformas"
    instance_type: linux_x2
    environment:
      flutter: stable

    scripts:
      - name: Instrucciones
        script: |
          echo "═══════════════════════════════════════════════════════════"
          echo "  CÓMO COMPILAR TODOS LOS INSTALADORES DE UNA VEZ"
          echo "═══════════════════════════════════════════════════════════"
          echo ""
          echo "En el panel web de Codemagic:"
          echo ""
          echo "  1. Click en 'Start new build' (botón verde arriba)"
          echo "  2. En el selector de workflows, marca AMBOS:"
          echo "       [x] apple-all      (Mac M2: APK + IPA + DMG)"
          echo "       [x] windows-build  (Windows: EXE)"
          echo "       [ ] all-platforms  (no marcar, es solo info)"
          echo "       [ ] ios-unsigned   (no marcar, ya está en apple-all)"
          echo ""
          echo "  3. Click 'Start new build'"
          echo ""
          echo "Resultado: ambos workflows arrancan EN PARALELO."
          echo "  · apple-all     dura ~25 min en una Mac M2"
          echo "  · windows-build dura ~15 min en una máquina Windows"
          echo ""
          echo "Al terminar, recibes correo con TODOS los archivos:"
          echo "  · tecno_lider.apk                 → Android"
          echo "  · tecno_lider.ipa                 → iOS"
          echo "  · tecno_lider.dmg                 → macOS"
          echo "  · tecno_lider-mac.zip             → macOS (alternativa)"
          echo "  · TecnoLider-Windows.zip          → Windows completo"
          echo "  · tecno_lider.exe                 → Windows (solo exe)"
          echo ""
          echo "═══════════════════════════════════════════════════════════"